title = "gitleaks config for equinox_enterprise"

[extend]
useDefault = true

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''

[[rules]]
id = "aws-secret-key" 
description = "AWS Secret Key"
regex = '''(?i)aws.*secret.*[A-Za-z0-9/+=]{40}'''

[[rules]]
id = "real-jwt-tokens"
description = "Real JWT tokens (actual secrets)"
regex = '''eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}'''

[[rules]]
id = "hardcoded-api-keys"
description = "Hardcoded API keys (not env vars)"
regex = '''(?i)(api[_-]?key|token|secret)\s*[:=]\s*['\"][A-Za-z0-9+/=]{32,}['\"]'''

[allowlist]
description = "Allowlist for safe development patterns"
regexes = [
    # Environment variable references (safe)
    '''process\.env\.[A-Z_]+''',
    # Function calls and method names
    '''signToken''',
    '''verifyToken''',
    '''getAuthSecret''',
    '''cookie\.serialize''',
    # Variable declarations that are safe
    '''const\s+(token|secret|password|apiKey)\s*=\s*(process\.env|signToken|verifyToken|getAuthSecret|parsed\.)''',
    # Schema definitions
    '''(password|token|secret):\s*z\.string''',
    # Comments
    '''//.*''',
    '''#.*''',
    # Test/example values
    '''(example|test|dummy)''',
    '''dev_secret_min_32_chars_local_only''',
    # Redacted placeholders in history
    '''<REDACTED.*>''',
    '''REDACTED_IN_REPO''',
    # Turso URL (not a secret, just a database URL)
    '''libsql://.*\.turso\.io''',
]

paths = [
    '''.gitleaksignore''',
    '''.env.example''',
    '''leaks.json''',
    '''node_modules/**''',
    '''.git/**''',
    '''.next/**''',
    '''dist/**''',
    '''build/**''',
    '''.env''',
    '''.env.local''',
    '''.env.*.local''',
]
